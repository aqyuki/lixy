[tools]
air = "1.66.1"
gitleaks = "8.30.1"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
node = "26.13.0"
pinact = "5.0.2"
pnpm = "12.18.0"

[hooks]
postinstall = { task = "setup" }

[tasks.setup]
description = "Install dependencies and setup tools."
run = ["pnpm install", "lefthook install"]

[settings]
lockfile = true
