version: '2'

linters:
  default: all
  disable:
    # not for me
    - decorder
    - embeddedstructfieldcheck
    - exhaustruct_v5
    - forbidigo
    - funcorder
    - gosmopolitan
    - godox
    - gochecknoglobals
    - gochecknoinits
    - grouper
    - ireturn
    - noinlineerr
    - recvcheck
    - testpackage
    - varnamelen
    # deprecated linters
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: errors
              desc: use github.com/cockroachdb/errors instead
            - pkg: github.com/pkg/errors
              desc: use github.com/cockroachdb/errors instead
    cyclop:
      max-complexity: 15
    gocyclo:
      min-complexity: 16
    gocognit:
      min-complexity: 20
    recvcheck:
      exclusions:
        - '*.Validate' # ozzo-validatorは値渡しで受け取った後に
    wrapcheck:
      ignore-package-globs:
        - github.com/go-ozzo/ozzo-validation/*
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true

run:
  timeout: 5m
