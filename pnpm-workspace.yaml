packages:
  - docs

saveExact: true

# vitepress-plugin-mermaid resolves these transitive dependencies from the site root.
publicHoistPattern:
  - '@braintree/sanitize-url'
  - dayjs
  - cytoscape-cose-bilkent
  - cytoscape

allowBuilds:
  esbuild: true

minimumReleaseAge: 10080 # 7 days (7*24*60 min)
